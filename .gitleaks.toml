title = "Mora Gitleaks configuration"

# Retain every built-in detector. Rule-specific exceptions below match both
# an exact fixture path and the expected synthetic value or line.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Synthetic content-free usage contract sentinels"
    condition = "AND"
    regexTarget = "line"
    regexes = [
      '''^\s*(usageContractBodySecret\s*=\s*"BODY_SECRET_7f211d9d"|usageContractMatchSecret\s*=\s*"MATCH_SECRET_93a9c521"|usageContractEvidenceSecret\s*=\s*"EVIDENCE_SECRET_4ed4c8a7")\s*$''',
    ]
    paths = [
      '''^internal/mora/usage_mcp_contract_test\.go$''',
    ]

    [[rules.allowlists]]
    description = "Public synthetic receipt SHA-256 digests (byte-pinned golden)"
    condition = "AND"
    regexTarget = "secret"
    regexes = ['''^[0-9a-f]{64}$''']
    paths = ['''^docs/experiments/memory-replay/contract/receipt\.v1\.json$''']

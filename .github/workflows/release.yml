name: Release

# Tag push → build → DRAFT release → verify artifacts → publish.
#
# The publish step is explicit and runs only after verification: `mora
# upgrade` (go-selfupdate) only sees PUBLISHED releases, so a build that
# fails verification never reaches an install. Required repo secret:
#   MORA_GOOGLE_CREDENTIALS_JSON — the full installed-app OAuth client JSON
#   (same file scripts/package.sh takes via MORA_GOOGLE_CREDENTIALS). Without
#   it the workflow fails fast rather than shipping binaries that embed the
#   DEV_PLACEHOLDER client, with which `mora connect google` cannot work.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release, upload assets, publish the draft
  id-token: write # cosign keyless signing (OIDC)

jobs:
  goreleaser:
    runs-on: ubuntu-latest # pure-Go cross-builds need no macOS runner (no notarization)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # REQUIRED for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: anchore/sbom-action/download-syft@v0 # syft for SBOM
      - uses: sigstore/cosign-installer@v3 # cosign for keyless signing

      # Validate ONLY — the actual embed happens inside goreleaser's before
      # hook (.goreleaser.yaml). Writing the tracked client.json here, before
      # goreleaser runs, fails its git dirty-tree check and aborts every
      # release; the before hook runs AFTER that check (v2.16.0 pipeline
      # order). The runner workspace is ephemeral — no restore needed
      # (package.sh's trap exists for local trees).
      - name: Validate OAuth client secret
        env:
          MORA_GOOGLE_CREDENTIALS_JSON: ${{ secrets.MORA_GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$MORA_GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::MORA_GOOGLE_CREDENTIALS_JSON secret is not set — refusing to build a placeholder-OAuth release. Add the secret (the installed-app client JSON) and re-tag."
            exit 1
          fi
          REAL_ID=$(printf '%s' "$MORA_GOOGLE_CREDENTIALS_JSON" | grep -oE '[0-9A-Za-z_-]+\.apps\.googleusercontent\.com' | head -1)
          if [ -z "$REAL_ID" ]; then
            echo "::error::MORA_GOOGLE_CREDENTIALS_JSON does not contain a Google OAuth client id"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.16.0" # exact pin: a floating major silently changes release behavior
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by the before hook that embeds the OAuth client.
          MORA_GOOGLE_CREDENTIALS_JSON: ${{ secrets.MORA_GOOGLE_CREDENTIALS_JSON }}
          # Fine-grained PAT with contents:write on pyranthus-hq/homebrew-tap.
          # Cask publishing is skip_upload: true in .goreleaser.yaml until the
          # token exists and the tap is public.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Verify what was actually built before anything becomes visible:
      #  1. the upgrade contract asset exists (checksums.txt — upgrade.go
      #     refuses a release without it; v0.6.0 shipped without one), and
      #  2. a built binary embeds the REAL OAuth client id, not the
      #     DEV_PLACEHOLDER (grep for placeholder absence can't work — the
      #     placeholder string is a detection constant compiled into every
      #     binary, so assert the real id's PRESENCE, like package.sh does).
      - name: Verify release artifacts
        run: |
          test -f dist/checksums.txt || { echo "::error::dist/checksums.txt missing — mora upgrade would reject this release"; exit 1; }
          REAL_ID=$(grep -oE '[0-9A-Za-z_-]+\.apps\.googleusercontent\.com' internal/google/client.json | head -1)
          # Guard against a vacuous pass: `| head -1` masks grep's exit status
          # (no pipefail on the default shell) and `grep -qF ""` below would
          # match ANY strings output — same guard package.sh carries.
          if [ -z "$REAL_ID" ]; then
            echo "::error::internal/google/client.json carries no real OAuth client id — the embed hook did not run?"
            exit 1
          fi
          ARCHIVE=$(find dist -maxdepth 1 -name 'mora_*_linux_amd64.tar.gz' | head -1)
          tar -xzf "$ARCHIVE" -C dist/
          BIN=$(find dist -type f -name mora | head -1)
          if ! strings "$BIN" | grep -qF "$REAL_ID"; then
            echo "::error::built binary does not embed the real OAuth client id — would ship broken \`connect google\`"
            exit 1
          fi
          echo "verified: checksums.txt present, real OAuth client embedded"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

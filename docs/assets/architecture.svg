<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     role="img"
     aria-label="Mora architecture: your sources flow into one local vault of Markdown plus a SQLite index, served over MCP to every agent (Claude Code, Codex, Gemini CLI), with an opt-in git sync to another machine.">
  <defs>
    <marker id="aF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="rgba(255,255,255,0.28)"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- background (baked in so it reads on GitHub light and dark) -->
  <rect x="0" y="0" width="760" height="376" fill="#0a0c10"/>
  <rect x="0.5" y="0.5" width="759" height="375" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- sources -->
  <text x="88" y="30" text-anchor="middle" font-size="10" letter-spacing="1" fill="rgba(255,255,255,0.55)">YOUR SOURCES</text>

  <line x1="152" y1="60" x2="288" y2="132" stroke="rgba(255,255,255,0.28)" marker-end="url(#aF)"/>
  <rect x="24" y="40" width="128" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="88" y="64" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.62)">Gmail</text>

  <line x1="152" y1="116" x2="288" y2="160" stroke="rgba(255,255,255,0.28)" marker-end="url(#aF)"/>
  <rect x="24" y="96" width="128" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="88" y="120" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.62)">Calendar</text>

  <line x1="152" y1="172" x2="288" y2="188" stroke="rgba(255,255,255,0.28)" marker-end="url(#aF)"/>
  <rect x="24" y="152" width="128" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="88" y="176" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.62)">iMessage</text>

  <line x1="152" y1="228" x2="288" y2="216" stroke="rgba(255,255,255,0.28)" marker-end="url(#aF)"/>
  <rect x="24" y="208" width="128" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="88" y="232" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.62)">Files</text>

  <!-- hub: the Mora vault -->
  <rect x="296" y="104" width="192" height="148" fill="rgba(59,130,246,0.07)" stroke="rgba(59,130,246,0.5)" stroke-width="1.25"/>
  <line x1="296" y1="104" x2="488" y2="104" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="392" y="150" text-anchor="middle" font-size="20" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#ededed">Mora</text>
  <text x="392" y="172" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.62)">vault on your machine</text>
  <text x="392" y="187" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.55)">Markdown + SQLite</text>
  <rect x="306" y="206" width="84" height="22" fill="none" stroke="rgba(255,255,255,0.14)"/>
  <text x="348" y="221" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.62)">entity graph</text>
  <rect x="396" y="206" width="86" height="22" fill="none" stroke="rgba(255,255,255,0.14)"/>
  <text x="439" y="221" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.62)">hybrid search</text>

  <!-- hub -> MCP -> agents -->
  <line x1="488" y1="178" x2="528" y2="178" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB)"/>
  <rect x="528" y="163" width="60" height="30" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.5)"/>
  <text x="558" y="183" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">MCP</text>

  <text x="681" y="92" text-anchor="middle" font-size="10" letter-spacing="1" fill="rgba(255,255,255,0.55)">YOUR AGENTS</text>

  <line x1="588" y1="178" x2="622" y2="120" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB)"/>
  <rect x="622" y="100" width="118" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="681" y="124" text-anchor="middle" font-size="11" fill="#ededed">Claude Code</text>

  <line x1="588" y1="178" x2="622" y2="178" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB)"/>
  <rect x="622" y="158" width="118" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="681" y="182" text-anchor="middle" font-size="11" fill="#ededed">Codex</text>

  <line x1="588" y1="178" x2="622" y2="236" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB)"/>
  <rect x="622" y="216" width="118" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)"/>
  <text x="681" y="240" text-anchor="middle" font-size="11" fill="#ededed">Gemini CLI</text>

  <!-- off-device: memory follows you across machines -->
  <line x1="392" y1="252" x2="392" y2="300" stroke="#3b82f6" stroke-width="1.25" stroke-dasharray="4 5" opacity="0.75" marker-end="url(#aB)"/>
  <rect x="287" y="300" width="210" height="40" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/>
  <text x="392" y="324" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.62)">another machine · same vault</text>
  <text x="392" y="362" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.55)">git sync (opt-in) · memory follows you</text>
</svg>

name: PR body

# Checks that read the PR description. Split from ci.yml so editing the title or
# body re-runs only these seconds-long checks, not the full suite. The job keeps
# its name, so a required check named readable-golden-reason still matches.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readable-golden-reason:
    # This is deliberately data-only: it inspects changed paths and the PR body,
    # never checks out or executes text supplied by a contributor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require reason for readable or contract golden changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only FETCH_HEAD HEAD > "$RUNNER_TEMP/changed-files.txt"
          export CHANGED_FILES="$RUNNER_TEMP/changed-files.txt"
          python3 - <<'PY'
          import os, re, sys
          changed = open(os.environ["CHANGED_FILES"], encoding="utf-8").read().splitlines()
          golden_changed = any(path.startswith((
              "internal/readable/testdata/", "internal/mora/testdata/contracts/"))
              for path in changed)
          if not golden_changed:
              raise SystemExit(0)
          body = os.environ.get("PR_BODY", "")
          if not re.search(r"(?mi)^Golden change reason:\s*\S.+$", body):
              print("::error::A readable or contract golden changed; add a non-empty 'Golden change reason:' line to the PR body.")
              sys.exit(1)
          PY

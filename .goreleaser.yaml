# GoReleaser config (schema v2) for mora — pure-Go, CGO_ENABLED=0 single binary.
# Tag a release (e.g. `git tag v0.2.0 && git push --tags`) → cross-platform
# archives + checksums + cosign signature + a Homebrew cask in pyranthus-hq/homebrew-tap.
#
# NOTE: uses `homebrew_casks:` (NOT the deprecated `brews:`, removed v2.16).
# Darwin binaries are Developer ID signed before GoReleaser archives them.
version: 2

project_name: mora

before:
  hooks:
    # verify, never tidy: a release build must not MUTATE go.mod/go.sum — if
    # they are stale, fail the release and fix them in a commit.
    - go mod verify
    # Embed the real OAuth client HERE, not in a workflow step: client.json is
    # git-tracked (the //go:embed needs a committed placeholder), and
    # goreleaser's git pipe runs its dirty-tree check BEFORE the before-hooks
    # pipe (v2.16.0 pipeline order: git → … → before → build). Writing the
    # file before invoking goreleaser fails EVERY release with "git is in a
    # dirty state". Guarded on the env var so a local `goreleaser check` or
    # snapshot build without credentials never clobbers the placeholder.
    - sh -c '[ -z "$MORA_GOOGLE_CREDENTIALS_JSON" ] || printf %s "$MORA_GOOGLE_CREDENTIALS_JSON" > internal/google/client.json'

builds:
  - id: mora
    main: ./cmd/mora
    binary: mora
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds
    hooks:
      post:
        # GoReleaser invokes this for every build target. The helper exits
        # immediately for non-Darwin targets and fails closed if signing or its
        # stable identifier/team/runtime/timestamp verification fails.
        - cmd: bash ./scripts/codesign-darwin.sh "{{ .Path }}" "{{ .Target }}"
          output: true

archives:
  - id: mora
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # This name MUST match what `mora upgrade` (go-selfupdate) expects:
    #   mora_<version>_<os>_<arch>.tar.gz (zip on Windows)
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - docs/guide.md
      - install.sh
      - examples/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Cosign keyless signing of the checksums file — Sigstore provenance, no key
# management. Requires `id-token: write` + cosign installed in the workflow.
signs:
  - cmd: cosign
    signature: "${artifact}.cosign.sig"
    certificate: "${artifact}.cosign.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# SBOM via syft (syft must be on the runner). Low priority — fine to drop until
# the public launch; comment out the block to skip.
sboms:
  - artifacts: archive

homebrew_casks:
  - name: mora
    # Flipping this requires THREE things, not two: (1) the HOMEBREW_TAP_TOKEN
    # secret exists in this repo, (2) pyranthus-hq/homebrew-tap is public, and
    # (3) cask publication MOVES AFTER the workflow's verify+publish gate —
    # goreleaser's cask pipe has NO draft check (v2.16.0 cask.go honors only
    # skip_upload), so flipping it here pushes a cask pointing at a still-DRAFT
    # release whose download URLs 404 for anonymous users if verification
    # fails. Publish the cask from a separate post-publish step/job instead.
    skip_upload: true
    repository:
      owner: pyranthus-hq
      name: homebrew-tap # create this repo: pyranthus-hq/homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/pyranthus-hq/mora"
    description: "Local-first, agent-agnostic memory CLI"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@pyranthus.com
    binaries:
      - mora
    # The archive contains the original Developer ID signed/notarized binary.
    # Never mutate that identity with a cask hook: Gatekeeper verifies it.

release:
  github:
    owner: pyranthus-hq
    name: mora
  # Draft on purpose: the workflow verifies the built artifacts (real OAuth
  # client embedded, checksums.txt present) and then publishes EXPLICITLY.
  # `mora upgrade` only sees published releases, so a draft that fails
  # verification never breaks an install.
  draft: true
  prerelease: auto

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

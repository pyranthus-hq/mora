title = "Mora Gitleaks configuration"

# Retain every built-in detector. The only override below is a narrow false-
# positive exception for synthetic redaction sentinels in one contract test.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Synthetic content-free usage contract sentinels"
    condition = "AND"
    regexTarget = "line"
    regexes = [
      '''usageContract(Body|Match|Evidence)Secret\s*=\s*"(BODY|MATCH|EVIDENCE)_SECRET_[0-9a-f]{8}"''',
    ]
    paths = [
      '''^internal/mora/usage_mcp_contract_test\.go$''',
    ]

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A property test with a random seed reports a different failure every run and
  # gets muted. Pin the seed, print it, and a counterexample is replayable — then
  # promoted into the committed ledger, which owns it forever.
  RAPID_SEED: "20260714"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: exam schema, ledger, and identity validation
        run: |
          go test ./internal/mora/exam -run 'TestLedgerValidator|TestCommittedLedgerIsValid|TestManifest|TestExamNoRealIdentities' -count=1
          go test ./internal/mora -run TestExamCorpusNoRealIdentities -count=1
      - name: exam regenerate-and-hash
        run: go test ./internal/mora -run TestExamCorpusHashesMatch -count=1
      # The stage order is the point: every stage's failure mode is cheaper to
      # diagnose than the next one's, and nothing downstream runs until the ground
      # truth is proven intact. A scorer number computed over a corpus that no longer
      # matches its ledger is not a low score — it is a lie, and it will be defended.
      - name: exam unit, property and round-trip
        # A FIXED seed, printed, so a failure here is replayable rather than a ghost.
        run: |
          echo "rapid replay seed: ${{ env.RAPID_SEED }}"
          go test ./internal/mora/exam ./internal/mora \
            -run 'TestExam(Render|Corpus)|TestLedgerQuotes|TestProp' \
            -count=1 -rapid.seed=$RAPID_SEED -rapid.checks=200
      - name: exam scorer self-tests and sabotage
        run: |
          go test ./internal/mora/exam \
            -run 'TestScorerRedTeam|TestEveryMetricHasASabotageCase|TestEveryRegisteredSabotageMovesItsMetric|TestMetricRegistryCoversEveryScorecardField|TestDuplicatePredictionsCannotInflateAnyCountedMetric|TestExamDeterminismGuard|TestScoreRefuses|TestGateControls|TestMatchIsExactNotContainment|TestUnknownNeverScoresCorrect|TestRedTeamManifestIsComplete' -count=1
          go test ./internal/mora -run 'TestObligationScoreReport|TestExamRealPredictionsPin|TestExamRealEngineScorecard|TestExamTestOnlyDepsAreNotLinked' -count=1
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (race + cover)
        # The race detector needs CGO. Enable it ONLY for the test run —
        # every build/release step stays CGO_ENABLED=0 (the product's thesis).
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -covermode=atomic ./...

  # Windows portability gate (#56 Phase 2 exit criterion): the FULL `go test ./...`
  # now runs on a real windows-latest runner, not just build+vet. The Phase 2
  # runtime-portability work landed (#67 filename sanitization, #71 test HOME
  # isolation, #73 file-mode/chmod/symlink/GOOS gates + LF golden files, #74
  # Windows-safe atomic rename), so the suite passes here. CGO_ENABLED=0 keeps it
  # matching the shipped static binary; the race detector pass is the Linux `test`
  # job (race needs CGO — not the point of this portability gate).
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        # The .golangci.yml is v2 format; action @v6 only installs golangci-lint
        # v1 (can't read a v2 config, and its go1.24 build < our go1.25 target).
        # @v8 installs v2; pin the exact build verified locally at 0 issues.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  # Pure-Go cross-arch build matrix: proves CGO_ENABLED=0 builds on every
  # target before a tag is ever cut. This is the single-binary guarantee, gated.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "mora-${GOOS}-${GOARCH}" ./cmd/mora

  # Binary-size tracking — comments the delta vs main. Advisory, not blocking:
  # a single small static binary IS the product, so size regressions matter.
  size:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the size diff can resolve the main baseline
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: build (linux/amd64)
        env: { CGO_ENABLED: "0", GOOS: linux, GOARCH: amd64 }
        run: go build -trimpath -ldflags="-s -w" -o mora ./cmd/mora
      - name: exam corpus is not linked into the product
        run: |
          if go list -deps ./cmd/mora | grep -q '/internal/mora/exam$'; then
            echo "::error::internal/mora/exam is linked into cmd/mora"
            exit 1
          fi
      - name: size diff vs main
        uses: jacobras/size-diff-action@v1
        continue-on-error: true # advisory only — a size hiccup must never block merge
        with:
          path: mora # the action's input is `path`, not `files`

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan sees every commit
      # Use the gitleaks CLI directly, not gitleaks-action@v2: the action requires
      # a (free, but mandatory) GITLEAKS_LICENSE for ORG-owned repos, and mora now
      # lives under the pyranthus-hq org. The OSS CLI has no such gate.
      - name: gitleaks (CLI)
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
